# Ambiente de DESENVOLVIMENTO: banco com dados de exemplo, descartável.
# Subir:   docker compose up -d --build
# Logs:    docker compose logs -f api
# Resetar: docker compose exec api npm run db:reset
name: sewwallet

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: sewwallet
      POSTGRES_PASSWORD: sewwallet
      POSTGRES_DB: sewwallet
      TZ: America/Sao_Paulo
    ports:
      - "5433:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sewwallet -d sewwallet"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
      target: dev
    environment:
      DATABASE_URL: postgresql://sewwallet:sewwallet@db:5432/sewwallet
      JWT_SECRET: dev-only-secret-change-me
      ALLOW_REGISTRATION: "true"
      SEED_ON_START: "true"
      APP_TZ: America/Sao_Paulo
      TZ: America/Sao_Paulo
      PORT: "3000"
    ports:
      - "3000:3000"
    volumes:
      - ./api:/app
      - api-node-modules:/app/node_modules
    depends_on:
      db:
        condition: service_healthy

  # App Flutter compilado para web. Recompila sozinho ao salvar; depois é só dar F5.
  web:
    build:
      context: .
      dockerfile: docker/app.Dockerfile
    environment:
      API_URL: http://localhost:3000
    ports:
      - "8080:8080"
    volumes:
      - ./app:/app
      - ./docker/app-dev.sh:/docker/app-dev.sh:ro
      - app-dart-tool:/app/.dart_tool
      - app-build:/app/build
      - pub-cache:/pub-cache
    depends_on:
      - api

  # Gera o APK em releases/. Não sobe com o "up"; rode sob demanda:
  #   docker compose --env-file .env.prod --profile tools run --rm apk
  apk:
    profiles: ["tools"]
    build:
      context: .
      dockerfile: docker/app.Dockerfile
    environment:
      API_URL: ${PUBLIC_API_URL:-http://localhost:3000}
    volumes:
      - ./app:/app
      - ./docker/build-apk.sh:/docker/build-apk.sh:ro
      - ./releases:/out
      - apk-dart-tool:/app/.dart_tool
      - apk-build:/app/build
      - pub-cache:/pub-cache
      - gradle-cache:/root/.gradle
    command: ["sh", "/docker/build-apk.sh"]

volumes:
  db-data:
  api-node-modules:
  app-dart-tool:
  app-build:
  pub-cache:
  apk-dart-tool:
  apk-build:
  gradle-cache:
