# Ambiente de PRODUÇÃO (PC de casa): dados reais, backup diário, acesso pelo Tailscale.
# Roda ao lado do dev (projeto, volumes e portas separados).
# Subir:   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
# Logs:    docker compose -f docker-compose.prod.yml --env-file .env.prod logs -f api
#
# Portas: app web 8081, API 3001, Postgres só em 127.0.0.1:5434.
name: sewwallet-prod

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      TZ: America/Sao_Paulo
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
      target: prod
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET}
      ALLOW_REGISTRATION: ${ALLOW_REGISTRATION:-false}
      APP_TZ: America/Sao_Paulo
      TZ: America/Sao_Paulo
      PORT: "3000"
    ports:
      - "3001:3000"
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: docker/app.prod.Dockerfile
      args:
        API_URL: ${PUBLIC_API_URL}
    restart: unless-stopped
    ports:
      - "8081:80"
    depends_on:
      - api

  backup:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-30}
      BACKUP_HOUR: ${BACKUP_HOUR:-03}
      TZ: America/Sao_Paulo
    volumes:
      - ./backups:/backups
      - ./docker/backup.sh:/backup.sh:ro
    entrypoint: ["sh", "/backup.sh"]
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
